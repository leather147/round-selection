name: Bootstrap component source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack source archive
        shell: bash
        run: |
          set -euo pipefail

          echo "c46c6175c88f53997190b7cc0494c6fead43c7cb4e404a587210dc5c7d105e7e  .bootstrap/chunk-00" | sha256sum --check --strict
          echo "c3fa19cac65f1bc5fac3d57730d775fb5c7b365f1195e14e7a8c173ee63ed4c7  .bootstrap/chunk-01" | sha256sum --check --strict
          echo "b4f645958c5bad731882ebedf9dd9c0b251428f60e23bc101ad8809e9000e083  .bootstrap/chunk-02" | sha256sum --check --strict
          echo "231cc572361c609949ef81216e4507a4b1128a68a0d9b46c7509683cc841299e  .bootstrap/chunk-03" | sha256sum --check --strict
          echo "803c0e777130ef34d5171a414a4c123f1c01c2d818b5d3b5d23ff15878c575ce  .bootstrap/chunk-04" | sha256sum --check --strict

          cat .bootstrap/chunk-* > /tmp/round-selection-src.b64
          echo "00b37e3088966dbaf01d41a67295050c822c90e92b71bf5e585090218eeda652  /tmp/round-selection-src.b64" | sha256sum --check --strict

          base64 --decode /tmp/round-selection-src.b64 > /tmp/round-selection-src.tgz
          echo "bbc3086637cf2dbf5828c450282e64be99075903bd2f673e81707f8249bd663a  /tmp/round-selection-src.tgz" | sha256sum --check --strict

          tar --extract --gzip --file /tmp/round-selection-src.tgz --directory .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit component source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Add UniversalTextSelection v0.3.0"
          git push origin HEAD:main
